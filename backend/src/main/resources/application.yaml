spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/hrplatform
    username: hruser
    password: hrpassword
    driver-class-name: org.postgresql.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          ssl:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  mail:
    from: onboarding@resend.dev
    app-url: ${APP_URL:http://localhost:5173}

server:
  port: ${PORT:8080}
